# Ghost Escape — Capacitor 8 iOS (App Store / TestFlight)
# Bundle ID must match Android: com.ghostescape.game

workflows:
  ghost-escape-ios:
    name: Ghost Escape iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ghostescape.game
      vars:
        BUNDLE_ID: "com.ghostescape.game"
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        # Replace after App Store Connect → App Information → Apple ID
        APP_STORE_APPLE_ID: 6832596667
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          LATEST_AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          LATEST_BUILD_NUMBER=$(( LATEST_TF > LATEST_AS ? LATEST_TF : LATEST_AS ))
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "0" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi
          echo "Latest TF=$LATEST_TF AS=$LATEST_AS → new build=$UPDATED_BUILD_NUMBER"
          agvtool new-version -all "$UPDATED_BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          # Ensure IPA is where Codemagic publishing looks (same issue as Beat Our AI).
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -print
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -exec cp -f {} "$CM_BUILD_DIR/build/ios/ipa/" \;
          ls -la "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/**/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload IPA to App Store Connect / TestFlight (internal). Do not auto-submit App Store.
        submit_to_testflight: true
        submit_to_app_store: false
